<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda & Présences - MSP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Version modulaire compatible CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        // Votre configuration Firebase personnalisée
        const firebaseConfig = {
            apiKey: "AIzaSyArpnO__4OxLJVIG9nwrcYMS8aPJ0_A_rc",
            authDomain: "agenda-msp-21e36.firebaseapp.com",
            databaseURL: "https://agenda-msp-21e36-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "agenda-msp-21e36",
            storageBucket: "agenda-msp-21e36.firebasestorage.app",
            messagingSenderId: "414473615009",
            appId: "1:414473615009:web:dff45dcd5dfa4efd4de2e0",
            measurementId: "G-YMEM701R0K"
        };

        // Initialisation de Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);

        // Données par défaut si la base est vide
        const defaultTeam = [
            { id: 1, name: 'Dr Dupont', role: 'Médecin' },
            { id: 2, name: 'Claire', role: 'Sage-femme' },
            { id: 3, name: 'Marc', role: 'Kinésithérapeute' },
            { id: 4, name: 'Julie', role: 'Infirmier' },
            { id: 5, name: 'Sandrine', role: 'Secrétaire' },
            { id: 6, name: 'Thomas', role: 'Coordinateur' }
        ];

        const defaultMeetings = [
            { id: 1, date: '2026-12-01', time: '13:00 - 14:00', title: 'Réunion de coordination pluriprofessionnelle', note: 'Prévoir l\'ordre du jour à l\'avance et valider les dossiers complexes.', presences: { 1: true, 2: false, 3: true, 4: false, 5: true, 6: true } }
        ];

        let teamMembers = [];
        let meetings = [];

        // Ordre de priorité exact des professions demandé
        const roleOrder = ['Médecin', 'Sage-femme', 'Infirmier', 'Kinésithérapeute', 'Secrétaire', 'Coordinateur'];

        function getSortedTeam() {
            return [...teamMembers].sort((a, b) => {
                let roleA = a.role.trim();
                let roleB = b.role.trim();

                let indexA = roleOrder.indexOf(roleA);
                let indexB = roleOrder.indexOf(roleB);

                if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                if (indexA !== -1) return -1;
                if (indexB !== -1) return 1;

                if (roleA !== roleB) {
                    return roleA.localeCompare(roleB, 'fr', { sensitivity: 'base' });
                }
                return a.name.localeCompare(b.name, 'fr', { sensitivity: 'base' });
            });
        }

        // Fonction utilitaire pour formater la date (ex: "2026-12-01" -> "01 déc 2026")
        function formatDateToFrench(dateString) {
            if (!dateString) return '';
            const parts = dateString.split('-');
            if (parts.length !== 3) return dateString;
            
            const year = parts[0];
            const monthIndex = parseInt(parts[1], 10) - 1;
            const day = parts[2];

            const months = ['jan', 'fév', 'mars', 'avr', 'mai', 'juin', 'juil', 'août', 'sept', 'oct', 'nov', 'déc'];
            if (monthIndex >= 0 && monthIndex < 12) {
                return `${day} ${months[monthIndex]} ${year}`;
            }
            return dateString;
        }

        // Synchronisation en temps réel avec Firebase
        const dbRef = ref(db, 'msp_data');
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                teamMembers = data.team || defaultTeam;
                meetings = data.meetings || defaultMeetings;
            } else {
                teamMembers = defaultTeam;
                meetings = defaultMeetings;
                saveToFirebase();
            }
            renderApp();
            if (!document.getElementById('team-modal').classList.contains('hidden')) {
                renderTeamList();
            }
        });

        function saveToFirebase() {
            set(ref(db, 'msp_data'), {
                team: teamMembers,
                meetings: meetings
            }).catch((error) => {
                console.error("Erreur de sauvegarde Firebase : ", error);
            });
        }

        // Fonctions globales exposées pour les boutons HTML
        window.toggleMeetingModal = function(meetingId = null) {
            const modal = document.getElementById('meeting-modal');
            const form = document.getElementById('meeting-form');
            const modalTitle = document.getElementById('meeting-modal-title');
            const submitBtn = document.getElementById('meeting-submit-btn');

            if (meetingId) {
                // Mode Modification
                const meeting = meetings.find(m => m.id === meetingId);
                if (meeting) {
                    document.getElementById('meeting-id').value = meeting.id;
                    document.getElementById('meeting-date').value = meeting.date;
                    document.getElementById('meeting-time').value = meeting.time;
                    document.getElementById('meeting-title').value = meeting.title;
                    document.getElementById('meeting-note').value = meeting.note || '';
                    modalTitle.textContent = "Modifier la réunion";
                    submitBtn.textContent = "Enregistrer les modifications";
                }
            } else {
                // Mode Création
                form.reset();
                document.getElementById('meeting-id').value = '';
                modalTitle.textContent = "Planifier une nouvelle réunion";
                submitBtn.textContent = "Créer la réunion";
            }

            modal.classList.toggle('hidden');
        }

        window.toggleTeamModal = function() {
            document.getElementById('team-modal').classList.toggle('hidden');
            renderTeamList();
        }

        window.addTeamMember = function(event) {
            event.preventDefault();
            const name = document.getElementById('member-name').value;
            const role = document.getElementById('member-role').value;
            
            const newMember = {
                id: Date.now(),
                name: name,
                role: role
            };

            teamMembers.push(newMember);
            document.getElementById('member-name').value = '';
            document.getElementById('member-role').value = '';
            saveToFirebase();
        }

        window.removeTeamMember = function(id) {
            teamMembers = teamMembers.filter(m => m.id !== id);
            saveToFirebase();
        }

        window.handleMeetingSubmit = function(event) {
            event.preventDefault();
            const idField = document.getElementById('meeting-id').value;
            const date = document.getElementById('meeting-date').value;
            const time = document.getElementById('meeting-time').value;
            const title = document.getElementById('meeting-title').value;
            const note = document.getElementById('meeting-note').value;

            if (idField) {
                // Modification d'une réunion existante
                const meeting = meetings.find(m => m.id == idField);
                if (meeting) {
                    meeting.date = date;
                    meeting.time = time;
                    meeting.title = title;
                    meeting.note = note;
                }
            } else {
                // Création d'une nouvelle réunion
                const newMeeting = {
                    id: Date.now(),
                    date: date,
                    time: time,
                    title: title,
                    note: note,
                    presences: {}
                };
                meetings.push(newMeeting);
            }

            document.getElementById('meeting-form').reset();
            window.toggleMeetingModal();
            saveToFirebase();
        }

        window.deleteMeeting = function(meetingId) {
            if (confirm("Êtes-vous sûr de vouloir supprimer cette réunion ?")) {
                meetings = meetings.filter(m => m.id !== meetingId);
                saveToFirebase();
            }
        }

        window.togglePresence = function(meetingId, memberId) {
            const meeting = meetings.find(m => m.id === meetingId);
            if (meeting) {
                if (!meeting.presences) meeting.presences = {};
                meeting.presences[memberId] = !meeting.presences[memberId];
                saveToFirebase();
            }
        }

        // Fonction d'export au format CSV
        window.exportToCSV = function() {
            const sortedTeam = getSortedTeam();
            if (meetings.length === 0) {
                alert("Aucune réunion à exporter.");
                return;
            }

            const sortedMeetings = [...meetings].sort((a, b) => b.date.localeCompare(a.date));

            // En-têtes CSV (incluant la note)
            let csvRows = [];
            let headers = ["Date", "Horaire", "Objet", "Note"];
            sortedTeam.forEach(member => {
                headers.push(`${member.name} (${member.role})`);
            });
            csvRows.push(headers.join(';'));

            // Lignes de données
            sortedMeetings.forEach(meeting => {
                let row = [
                    `"${formatDateToFrench(meeting.date)}"`,
                    `"${meeting.time}"`,
                    `"${meeting.title.replace(/"/g, '""')}"`,
                    `"${(meeting.note || '').replace(/"/g, '""')}"`
                ];

                sortedTeam.forEach(member => {
                    const isPresent = meeting.presences && meeting.presences[member.id] ? "Présent" : "Absent";
                    row.push(`"${isPresent}"`);
                });

                csvRows.push(row.join(';'));
            });

            // Création et téléchargement du fichier
            const csvString = csvRows.join('\r\n');
            const blob = new Blob(["\uFEFF" + csvString], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'presences_msp.csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function renderTeamList() {
            const listContainer = document.getElementById('team-list');
            listContainer.innerHTML = '';
            const sortedTeam = getSortedTeam();

            if (sortedTeam.length === 0) {
                listContainer.innerHTML = '<p class="text-xs text-gray-400 p-2 text-center">Aucun membre dans l\'équipe.</p>';
                return;
            }

            sortedTeam.forEach(member => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-2 bg-gray-50 rounded-lg text-sm';
                div.innerHTML = `
                    <div>
                        <span class="font-medium text-gray-800">${member.name}</span>
                        <span class="ml-2 text-xs bg-blue-100 text-[#1B4F72] px-2 py-0.5 rounded-full">${member.role}</span>
                    </div>
                    <button onclick="removeTeamMember(${member.id})" class="text-red-500 hover:text-red-700 font-bold px-2">&times;</button>
                `;
                listContainer.appendChild(div);
            });
        }

        function renderApp() {
            const headerRow = document.getElementById('table-header');
            const bodyContainer = document.getElementById('table-body');
            const sortedTeam = getSortedTeam();

            // Tri des réunions : de la plus récente à la plus ancienne (décroissant)
            const sortedMeetings = [...meetings].sort((a, b) => b.date.localeCompare(a.date));

            let headerHTML = `<th class="p-3">Date & Horaire</th><th class="p-3">Objet</th>`;
            sortedTeam.forEach(member => {
                headerHTML += `<th class="p-3 text-center">
                    <div>${member.name}</div>
                    <span class="text-[10px] font-normal text-gray-400">${member.role}</span>
                </th>`;
            });
            headerHTML += `<th class="p-3 text-center">Actions</th>`;
            headerRow.innerHTML = headerHTML;

            bodyContainer.innerHTML = '';
            if (sortedMeetings.length === 0) {
                bodyContainer.innerHTML = `<tr><td colspan="${3 + sortedTeam.length}" class="p-6 text-center text-gray-400">Aucune réunion planifiée pour le moment.</td></tr>`;
                return;
            }

            sortedMeetings.forEach(meeting => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition';
                
                const formattedDate = formatDateToFrench(meeting.date);
                const hasNote = meeting.note && meeting.note.trim() !== '';

                let noteHTML = '';
                if (hasNote) {
                    noteHTML = `
                        <div class="relative group inline-block ml-2 align-middle">
                            <span class="cursor-pointer text-blue-600 hover:text-blue-800 bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded-md text-xs font-medium transition inline-flex items-center gap-1 border border-blue-200">
                                📝 Note
                            </span>
                            <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block w-64 p-3 bg-gray-900 text-white text-xs rounded-xl shadow-xl z-20 pointer-events-none text-left leading-relaxed">
                                <p class="font-semibold text-blue-300 mb-1 border-b border-gray-700 pb-1">Note de la réunion :</p>
                                ${meeting.note.replace(/</g, "&lt;").replace(/>/g, "&gt;")}
                                <div class="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-gray-900"></div>
                            </div>
                        </div>
                    `;
                }

                let rowHTML = `
                    <td class="p-3 font-medium whitespace-nowrap">
                        ${formattedDate}<br>
                        <span class="text-xs font-normal text-gray-500">${meeting.time}</span>
                    </td>
                    <td class="p-3 text-gray-700">
                        <div class="flex items-center flex-wrap gap-1">
                            <span>${meeting.title}</span>
                            ${noteHTML}
                        </div>
                    </td>
                `;

                sortedTeam.forEach(member => {
                    const isChecked = meeting.presences && meeting.presences[member.id] ? 'checked' : '';
                    rowHTML += `
                        <td class="p-3 text-center">
                            <input type="checkbox" ${isChecked} onchange="togglePresence(${meeting.id}, ${member.id})" 
                            class="w-5 h-5 text-[#1B4F72] rounded focus:ring-[#1B4F72] cursor-pointer accent-[#1B4F72]">
                        </td>
                    `;
                });

                // Colonne Actions (Modifier / Supprimer)
                rowHTML += `
                    <td class="p-3 text-center whitespace-nowrap space-x-2">
                        <button onclick="toggleMeetingModal(${meeting.id})" title="Modifier" class="bg-blue-50 hover:bg-blue-100 text-[#1B4F72] p-1.5 rounded-lg text-xs transition">
                            ✏️
                        </button>
                        <button onclick="deleteMeeting(${meeting.id})" title="Supprimer" class="bg-red-50 hover:bg-red-100 text-red-600 p-1.5 rounded-lg text-xs transition">
                            🗑️
                        </button>
                    </td>
                `;

                tr.innerHTML = rowHTML;
                bodyContainer.appendChild(tr);
            });
        }
    </script>
    <style>
        .custom-title { color: #1B4F72; }
        .custom-btn { background-color: #1B4F72; }
        .custom-btn:hover { background-color: #154360; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-8">
        
        <!-- En-tête avec Logo et Boutons d'action -->
        <header class="bg-white p-6 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <!-- Logo MSP -->
                <img src="Logo blanc MSP.png" alt="Logo MSP" class="h-14 w-auto object-contain">
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold custom-title">Agenda & Présences MSP</h1>
                    <p class="text-gray-500 text-sm">Coordination et suivi des réunions pluriprofessionnelles</p>
                </div>
            </div>
            <div class="flex flex-wrap gap-3">
                <button onclick="exportToCSV()" class="bg-sky-600 hover:bg-sky-700 text-white font-medium px-4 py-2.5 rounded-xl transition shadow flex items-center gap-2">
                    <span>📥</span> Exporter en CSV
                </button>
                <button onclick="toggleMeetingModal()" class="custom-btn text-white font-medium px-4 py-2.5 rounded-xl transition shadow flex items-center gap-2">
                    <span>📅</span> Créer une réunion
                </button>
                <button onclick="toggleTeamModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2.5 rounded-xl transition shadow flex items-center gap-2">
                    <span>⚙️</span> Organiser l'équipe
                </button>
            </div>
        </header>

        <!-- Tableau des présences -->
        <section class="bg-white p-6 rounded-2xl shadow-sm overflow-x-auto">
            <h2 class="text-xl font-semibold mb-4 custom-title">Suivi des présences</h2>
            <table class="w-full text-left border-collapse" id="presence-table">
                <thead>
                    <tr id="table-header" class="bg-gray-50 border-b text-sm text-gray-600">
                        <!-- Injecté dynamiquement par JS -->
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y text-sm">
                    <!-- Injecté dynamiquement par JS -->
                </tbody>
            </table>
        </section>

    </div>

    <!-- Modal : Créer / Modifier une réunion -->
    <div id="meeting-modal" class="fixed inset-0 bg-black/50 hidden flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-6 shadow-xl">
            <div class="flex justify-between items-center border-b pb-4">
                <h3 id="meeting-modal-title" class="text-xl font-bold custom-title">Planifier une nouvelle réunion</h3>
                <button onclick="toggleMeetingModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>

            <form id="meeting-form" onsubmit="handleMeetingSubmit(event)" class="space-y-4">
                <input type="hidden" id="meeting-id">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Date</label>
                    <input type="date" id="meeting-date" required class="w-full border rounded-xl p-2.5 focus:ring-2 focus:ring-[#1B4F72] outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Horaires</label>
                    <input type="text" id="meeting-time" placeholder="Ex: 13h00 - 14h00" required class="w-full border rounded-xl p-2.5 focus:ring-2 focus:ring-[#1B4F72] outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Objet / Type de réunion</label>
                    <input type="text" id="meeting-title" placeholder="Ex: Réunion de coordination" required class="w-full border rounded-xl p-2.5 focus:ring-2 focus:ring-[#1B4F72] outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Note (optionnelle)</label>
                    <textarea id="meeting-note" rows="3" placeholder="Ex: Ordre du jour, informations importantes..." class="w-full border rounded-xl p-2.5 focus:ring-2 focus:ring-[#1B4F72] outline-none text-sm"></textarea>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="toggleMeetingModal()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2.5 rounded-xl text-sm transition">
                        Annuler
                    </button>
                    <button type="submit" id="meeting-submit-btn" class="custom-btn text-white font-medium px-5 py-2.5 rounded-xl text-sm transition shadow">
                        Créer la réunion
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal : Organiser l'équipe -->
    <div id="team-modal" class="fixed inset-0 bg-black/50 hidden flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 space-y-6 shadow-xl">
            <div class="flex justify-between items-center border-b pb-4">
                <h3 class="text-xl font-bold custom-title">Organiser l'équipe de la MSP</h3>
                <button onclick="toggleTeamModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>

            <!-- Formulaire d'ajout de membre -->
            <form onsubmit="addTeamMember(event)" class="space-y-4 bg-gray-50 p-4 rounded-xl">
                <h4 class="font-semibold text-sm text-gray-700">Ajouter un professionnel</h4>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input type="text" id="member-name" placeholder="Nom (ex: Dr Martin / Sophie)" required class="border rounded-lg p-2 text-sm outline-none focus:ring-1 focus:ring-[#1B4F72] bg-white">
                    
                    <input type="text" id="member-role" list="roles-list" placeholder="Profession..." required class="border rounded-lg p-2 text-sm outline-none focus:ring-1 focus:ring-[#1B4F72] bg-white">
                    <datalist id="roles-list">
                        <option value="Médecin">
                        <option value="Sage-femme">
                        <option value="Infirmier">
                        <option value="Kinésithérapeute">
                        <option value="Secrétaire">
                        <option value="Coordinateur">
                        <option value="Psychologue">
                        <option value="Diététicien">
                    </datalist>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm transition">
                    + Ajouter à l'équipe
                </button>
            </form>

            <!-- Liste des membres actuels -->
            <div>
                <h4 class="font-semibold text-sm text-gray-700 mb-2">Membres enregistrés</h4>
                <div id="team-list" class="max-h-48 overflow-y-auto space-y-2 border rounded-xl p-2 bg-white">
                    <!-- Injecté par JS -->
                </div>
            </div>

            <div class="flex justify-end pt-2">
                <button onclick="toggleTeamModal()" class="bg-gray-800 hover:bg-gray-900 text-white px-5 py-2 rounded-xl text-sm transition">
                    Fermer
                </button>
            </div>
        </div>
    </div>

</body>
</html>
